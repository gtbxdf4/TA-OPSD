name: Code checks

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt -r requirements-analysis.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q run.py src scripts baselines diagnostics analysis tests
      - run: pytest
      - run: python analysis/reproduce.py
